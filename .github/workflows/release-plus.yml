name: Release Plus

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-plus
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0

jobs:
  version:
    if: github.repository == 'Nefelibata-D/Clash-Verge-Rev'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v8
        id: version
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { version: sourceVersion } = JSON.parse(readFileSync('package.json', 'utf8'));
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(sourceVersion)) {
              throw new Error(`Expected a stable package.json version: ${sourceVersion}`);
            }
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))\.([1-9]\d*)$/.exec(tag);
            if (!match || match[1] !== sourceVersion) {
              throw new Error(`Expected v${sourceVersion}.N with N >= 1: ${tag}`);
            }
            const version = `${sourceVersion}-${match[2]}`;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release?.draft && release.target_commitish !== context.sha) {
              throw new Error(`Draft ${tag} belongs to another commit; remove it before rebuilding.`);
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('publish', !release || release.draft);
            core.setOutput('draft', Boolean(release?.draft));
            core.info(release && !release.draft ? `${tag} already published; skipping.` : `Building ${tag}`);

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: plus-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - name: Set SemVer application version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: node scripts/release-plus-version.mjs "$RELEASE_VERSION"
      - run: pnpm prebuild ${{ matrix.target }}
      - name: Build signed installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_PRIVATE_KEY is required'; exit 1; }
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.sig
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/deb/*.sig
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/rpm/*.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      EXISTING_DRAFT: ${{ needs.version.outputs.draft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true
      - name: Prepare installers and update manifest
        run: node scripts/updater-plus.mjs artifacts release-assets
      - name: Publish complete release
        run: |
          if [ "$EXISTING_DRAFT" != true ]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --verify-tag --draft \
              --title "Clash Verge Rev $RELEASE_TAG" \
              --notes "Windows and Linux AMD64. Version follows official stable ${RELEASE_VERSION%-*}."
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
